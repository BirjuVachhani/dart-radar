# Publish website/ to GitHub Pages, and mirror it to the gh-pages branch.
#
# The site is plain HTML, CSS and images, so there is nothing to build: the
# directory is uploaded as-is. Enable it once under Settings > Pages by setting
# "Source" to "GitHub Actions"; without that the deploy step fails with a 404.
#
# gh-pages holds only the site contents at the repo root, so a host that serves
# a branch (Vercel, Netlify, Cloudflare Pages) can point at it with no build
# command and no root directory to configure.

name: Publish website

on:
  push:
    branches: [main]
    # Only the site is published here, so a code-only push should not spend a
    # deploy. Includes this workflow itself, so a change to it is exercised.
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  # Read to check out, write to force-push the gh-pages branch.
  contents: write
  # deploy-pages authenticates to Pages with an OIDC token, not a PAT.
  pages: write
  id-token: write

# Let a queued run wait for one in flight rather than cancelling it: cancelling
# a deploy mid-flight can leave the site on a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # A Jekyll build is the Pages default and would drop any file or folder
      # whose name starts with an underscore. Nothing here relies on Jekyll, so
      # .nojekyll makes the upload byte-for-byte what gets served.
      - name: Disable Jekyll processing
        run: touch website/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # Runs after the upload so the throwaway .git directory created here is
      # never part of the Pages artifact. gh-pages carries no history: every run
      # replaces it with a single commit, which is all a branch-deploy host reads.
      - name: Mirror to gh-pages
        run: |
          git init -q -b gh-pages website
          git -C website config user.name 'github-actions[bot]'
          git -C website config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C website add -A
          git -C website commit -qm "Publish website from $GITHUB_SHA"
          git -C website push -qf \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" \
            HEAD:gh-pages
